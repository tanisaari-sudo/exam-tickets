<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Экзамен</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Форма ввода */
        .input-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .input-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Билеты */
        .tickets-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
        }

        .ticket-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .ticket-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .ticket-btn.taken {
            background: linear-gradient(145deg, #9e9e9e, #757575);
            cursor: not-allowed;
        }

        .ticket-btn.taken:hover {
            transform: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Результат */
        .result-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .result-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .result-header h2 {
            margin-bottom: 5px;
        }

        .result-info {
            display: grid;
            gap: 5px;
            font-size: 14px;
        }

        .questions-block {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .question:last-child {
            margin-bottom: 0;
        }

        .question-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .grade-section {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .grade-section label {
            font-weight: bold;
            color: #333;
        }

        .grade-section select {
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .buttons-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-send {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        .btn-return {
            background: linear-gradient(145deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-return:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .status-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Экзаменационные билеты</h1>

        <!-- Ввод данных -->
        <div class="input-section">
            <div class="input-row">
                <div class="input-group">
                    <label>Фамилия студента:</label>
                    <input type="text" id="surname" placeholder="Введите фамилию">
                </div>
                <div class="input-group">
                    <label>Группа:</label>
                    <select id="group">
                        <option value="">-- Выберите группу --</option>
                        <option value="ИИБ-501-О">ИИБ-501-О</option>
                        <option value="ИУБ-501-О">ИУБ-501-О</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Билеты -->
        <div class="tickets-section">
            <div class="tickets-grid" id="ticketsGrid"></div>
        </div>

        <!-- Результат -->
        <div class="result-section" id="resultSection">
            <div class="result-header">
                <h2>🎫 Билет № <span id="ticketNumber"></span></h2>
                <div class="result-info">
                    <div>Студент: <strong id="resultSurname"></strong></div>
                    <div>Группа: <strong id="resultGroup"></strong></div>
                </div>
            </div>

            <div class="questions-block">
                <div class="question">
                    <div class="question-label">Вопрос 1:</div>
                    <div id="question1"></div>
                </div>
                <div class="question">
                    <div class="question-label">Вопрос 2:</div>
                    <div id="question2"></div>
                </div>
            </div>

            <div class="grade-section">
                <label>Оценка:</label>
                <select id="grade">
                    <option value="">-- Выберите --</option>
                    <option value="5">5 (отлично)</option>
                    <option value="4">4 (хорошо)</option>
                    <option value="3">3 (удовлетворительно)</option>
                    <option value="2">2 (неудовлетворительно)</option>
                    <option value="неявка">Неявка</option>
                </select>
            </div>

            <div class="buttons-row">
                <button class="btn btn-send" onclick="sendData()">📤 Отправить в таблицу</button>
                <button class="btn btn-return" onclick="returnTicket()">🔄 Вернуть билет</button>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </div>
    </div>

    <script>
        // ========== БИЛЕТЫ ==========
        const tickets = [
            {
                id: 1,
                question1: "Законодательство РФ в сфере охраны памятников объектов историко-культурного наследия",
                question2: "Поздний палеолит"
            },
            {
                id: 2,
                question1: "Объект и предмет археологии. Место археологии в системе наук",
                question2: "Археологические культуры палеолита"
            },
            {
                id: 3,
                question1: "Археологические памятники и их виды",
                question2: "Эпоха мезолита: общая характеристика"
            },
            {
                id: 4,
                question1: "Культурный слой и стратиграфия",
                question2: "Археологические культуры эпохи мезолита"
            },
            {
                id: 5,
                question1: "Археологический источник",
                question2: "Эпоха неолита: общая характеристика"
            },
            {
                id: 6,
                question1: "Археологическая культура",
                question2: "Археологические культуры эпохи неолита южной зоны производящего хозяйства"
            },
            {
                id: 7,
                question1: "Хронология и периодизация в археологии",
                question2: "Археологические культуры эпохи неолита северной зоны присваивающего хозяйства"
            },
            {
                id: 8,
                question1: "Классификация в археологии",
                question2: "Общая характеристика эпохи палеометалла"
            },
            {
                id: 9,
                question1: "Типология в археологии",
                question2: "Энеолит: общая характеристика"
            },
            {
                id: 10,
                question1: "Методы датирования археологического материала",
                question2: "Археологические культуры энеолита"
            },
            {
                id: 11,
                question1: "Развитие техники изготовления каменных изделий в древности",
                question2: "Бронзовый век: общая характеристика"
            },
            {
                id: 12,
                question1: "Керамика: методы исследования",
                question2: "Археологические культуры бронзового века"
            },
            {
                id: 13,
                question1: "Этапы развития и цветной металлургии. Металлургические центры в эпоху раннего металла",
                question2: "Общая характеристика раннего железного века"
            },
            {
                id: 14,
                question1: "Археологические разведки",
                question2: "Ранний железный век лесной полосы Восточной Европы"
            },
            {
                id: 15,
                question1: "Археологические раскопки",
                question2: "Ранний железный век степной зоны Евразии. Скифосибирская общность"
            },
            {
                id: 16,
                question1: "Общая характеристика каменного века",
                question2: "Культуры сарматской эпохи"
            },
            {
                id: 17,
                question1: "Ранний палеолит",
                question2: "Средневековые государства в Сибири в эпоху средневековья"
            },
            {
                id: 18,
                question1: "Средний палеолит",
                question2: "Вопрос по выбору"
            }
        ];

        // Ссылки на Google Таблицы
        const googleSheets = {
            "ИИБ-501-О": "https://script.google.com/macros/s/AKfycbxMLqaWGQv4Qsn1tkuUzpybw_NMWExyZK6pPFtDInn8TX7CRwf8KVfle6eDHg1pklCXYw/exec",
            "ИУБ-501-О": "https://script.google.com/macros/s/AKfycbx8OBX3SosuJ1nNFGXo_M_M6rfd02ckyK99wRUuvKP583iZCmwvPEbe7J2PiPDb2XJW/exec"
        };

        let takenTickets = JSON.parse(localStorage.getItem('takenTickets')) || [];
        let currentTicket = null;

        // Создание кнопок
        function renderTickets() {
            const grid = document.getElementById('ticketsGrid');
            grid.innerHTML = '';
            
            tickets.forEach(ticket => {
                const btn = document.createElement('button');
                btn.className = 'ticket-btn';
                if (takenTickets.includes(ticket.id)) {
                    btn.classList.add('taken');
                }
                // Кнопки пустые - без номеров
                btn.innerHTML = '';
                btn.onclick = () => selectTicket(ticket.id);
                grid.appendChild(btn);
            });
        }

        // Выбор билета
        function selectTicket(id) {
            const surname = document.getElementById('surname').value.trim();
            const group = document.getElementById('group').value;

            if (!surname) {
                alert('Введите фамилию студента!');
                return;
            }

            if (!group) {
                alert('Выберите группу!');
                return;
            }

            if (takenTickets.includes(id)) {
                alert('Этот билет уже взят!');
                return;
            }

            currentTicket = tickets.find(t => t.id === id);
            
            // Показываем результат
            document.getElementById('ticketNumber').textContent = currentTicket.id;
            document.getElementById('resultSurname').textContent = surname;
            document.getElementById('resultGroup').textContent = group;
            document.getElementById('question1').textContent = currentTicket.question1;
            document.getElementById('question2').textContent = currentTicket.question2;
            document.getElementById('grade').value = '';
            document.getElementById('statusMessage').className = 'status-message';
            document.getElementById('statusMessage').textContent = '';
            
            document.getElementById('resultSection').classList.add('active');

            // Отмечаем билет как взятый
            takenTickets.push(id);
            localStorage.setItem('takenTickets', JSON.stringify(takenTickets));
            renderTickets();
        }

        // Отправка данных
        async function sendData() {
            const surname = document.getElementById('resultSurname').textContent;
            const group = document.getElementById('resultGroup').textContent;
            const grade = document.getElementById('grade').value;
            const statusMessage = document.getElementById('statusMessage');

            if (!grade) {
                alert('Выберите оценку!');
                return;
            }

            const sheetUrl = googleSheets[group];
            
            const data = {
                surname: surname,
                group: group,
                ticketNumber: currentTicket.id,
                question1: currentTicket.question1,
                question2: currentTicket.question2,
                grade: grade
            };

            try {
                statusMessage.className = 'status-message';
                statusMessage.textContent = 'Отправка...';
                statusMessage.style.display = 'block';
                statusMessage.style.background = '#fff3cd';
                statusMessage.style.color = '#856404';

                await fetch(sheetUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                statusMessage.className = 'status-message success';
                statusMessage.textContent = '✅ Данные отправлены в таблицу!';

                // Скрываем результат через 2 секунды
                setTimeout(() => {
                    document.getElementById('resultSection').classList.remove('active');
                    document.getElementById('surname').value = '';
                    currentTicket = null;
                }, 2000);

            } catch (error) {
                statusMessage.className = 'status-message error';
                statusMessage.textContent = '❌ Ошибка отправки: ' + error.message;
            }
        }

        // Вернуть билет
        function returnTicket() {
            if (currentTicket) {
                takenTickets = takenTickets.filter(id => id !== currentTicket.id);
                localStorage.setItem('takenTickets', JSON.stringify(takenTickets));
                renderTickets();
                
                document.getElementById('resultSection').classList.remove('active');
                currentTicket = null;
                
                alert('Билет возвращён!');
            }
        }

        // Запуск
        renderTickets();
    </script>
</body>
</html>
